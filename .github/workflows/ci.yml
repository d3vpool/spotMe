name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spotme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spotme_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/spotme_test
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      PORT: "3000"
      FRONTEND_URL: http://localhost:5173
      GOOGLE_DRIVE_API_KEY: ci-test-key-not-real
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Enable pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d spotme_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Push schema to test DB
        working-directory: backend
        run: npx prisma db push

      - name: Lint backend
        working-directory: backend
        run: npm run lint

      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend — lint, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker — build runtime image (no push)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build-only: validates the multi-stage Dockerfile compiles the frontend
      # + backend and that native deps (tfjs-node, canvas) load in the final
      # image. Nothing is pushed anywhere.
      - name: Build image
        run: docker build --tag spotme:ci .
